<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Ecosystem Simulation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <div class="top-bar">
        <div class="title-group">
          <h1>Ecosystem Simulation</h1>
          <p class="subtitle">By: Zimon Roos</p>
        </div>
        <p id="rainStatus" class="rain-status">Is it raining? No</p>
      </div>
      <canvas id="world" width="800" height="800" aria-label="Ecosystem simulation canvas"></canvas>
      <div class="meta">
        <div class="counts">
          <span id="rabbitCount">Rabbits: 0</span>
          <span id="timeOfDay">Time: 0</span>
          <span id="dayOfYear">Day: 1 Jan</span>
          <span id="mouseCoords">X: - Y: -</span>
        </div>
        <button id="resetBtn" type="button">Reset</button>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
