<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Ecosystem Simulation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Ecosystem Simulation</h1>
      <p class="subtitle">By: Zimon Roos</p>
      <canvas id="world" width="800" height="600" aria-label="Ecosystem simulation canvas"></canvas>
      <div class="meta">
        <div class="counts">
          <span id="grassCount">Grass: 0</span>
          <span id="rabbitCount">Rabbits: 0</span>
        </div>
        <button id="resetBtn" type="button">Reset</button>
      </div>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
